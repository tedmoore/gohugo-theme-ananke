{{ define "main" }}
  <!-- <article class="pa0 pa4-ns nested-copy-line-height nested-img"> -->
  <article class="pa0 pa4-ns nested-copy-line-height">
    <section class="cf ph0 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy {{ $.Param "text_color" | default "mid-gray" }}">
      {{- .Content -}}
    </section>
    <section class="flex flex-column items-center mt0">
        {{ range .Paginator.Pages }}
          <div class="relative w-90 w-40-l mb3 bg-white">
            {{ .Render "blog-summary" }}
          </div>
        {{ end }}
      </section>
    {{- template "_internal/pagination.html" . -}}
  </article>
{{ end }}
