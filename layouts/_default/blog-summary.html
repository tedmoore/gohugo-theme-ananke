<div class='{{ $.Param "text_color" | default "mid-gray" }} overflow-hidden lh-solid mb4'>
    {{ if .Date }}
      <div class="f5">
        {{ .Date | time.Format (default "January 2, 2006" .Site.Params.date_format) }}
      </div>
    {{ end }}
    <h1 class="f3 near-black lh-solid">
      <a href="{{ .RelPermalink }}" class="link black dim">{{ .Title | markdownify }}</a>
    </h1>
    <div class="f5">
        {{ .Description | markdownify }}
    </div>
    <!-- <div class="nested-links f5 lh-copy nested-copy-line-height">
      {{ .Summary  }}
    </div> -->
  </div>
